# Telegram notifications without Apprise
# https://github.com/mlengle/telegram_notify

[gcode_macro TELEGRAM_NOTIFY]
description: Send a Telegram message: TELEGRAM_NOTIFY MSG="text" PHOTO=1
gcode:
    {% set msg = params.MSG|default("Ok")|string %}
    {% set photo = params.PHOTO|default(0)|int %}
    {action_call_remote_method("telegram_notify", message=msg, photo=photo)}

# Called by zmod: printer events, filament sensors
[gcode_macro _NOTIFY]
gcode:
    {% set notify_photo = printer.save_variables.variables.notify_photo|default(1)|int %}

    {% set msg = params.MSG|default("Ok")|string %}
    {% set photo = params.PHOTO|default(1)|int %}
    {% set type = params.TYPE|default("ok")|string %}

    {% set var_name = 'notify_' ~ type %}
    {% set type_on = printer.save_variables.variables[var_name]|default(1)|int %}

    {% if type_on == 1 %}
        {action_call_remote_method("telegram_notify",
                             message=msg,
                             photo=1 if photo == 1 and notify_photo == 1 else 0)}
    {% endif %}

# Called by zmod during a print
[gcode_macro _NOTIFY_ON_PERCENT]
variable_notified_percent: 0
variable_last_percent: 0
gcode:
    {% set notify_step = printer.save_variables.variables.notify_percent|default(0)|int %}

    {% if notify_step > 0 %}
        {% set progress = printer.virtual_sdcard.progress|default(0)|float %}
        {% set current_percent = (progress * 100)|round(1)|float %}

        {% set last_notified = printer["gcode_macro _NOTIFY_ON_PERCENT"].notified_percent|int %}
        {% set next_threshold = ((last_notified // notify_step) + 1) * notify_step %}

        {% if current_percent >= next_threshold and current_percent > last_notified %}
            {% set filename = printer.print_stats.filename|default("Unknown")|string %}
            {% set basename = filename.split('/')[-1].split('\\')[-1] %}

            {% set et = printer.extruder.temperature|default(0)|round(1) %}
            {% set et_t = printer.extruder.target|default(0)|round(1) %}
            {% set bt = printer.heater_bed.temperature|default(0)|round(1) %}
            {% set bt_t = printer.heater_bed.target|default(0)|round(1) %}

            {% set msg = "%s (%d%%) | %.1f/%.1f°C | %.1f/%.1f°C" |
                format(basename, current_percent|int, et, et_t, bt, bt_t) %}

            # Sent directly, a file name with quotes or semicolons breaks _NOTIFY MSG
            {% set notify_photo = printer.save_variables.variables.notify_photo|default(1)|int %}
            {% if printer.save_variables.variables.notify_ok|default(1)|int == 1 %}
                {action_call_remote_method("telegram_notify", message=msg, photo=notify_photo)}
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_NOTIFY_ON_PERCENT VARIABLE=notified_percent VALUE={current_percent|int}
        {% endif %}
    {% endif %}

# Restores the link of the Moonraker component at every Klipper start,
# e.g. after Moonraker was reinstalled
[gcode_shell_command telegram_notify_repair]
command: /opt/config/mod_data/plugins/telegram_notify/repair.sh
timeout: 60
verbose: False

[delayed_gcode _TELEGRAM_NOTIFY_REPAIR]
initial_duration: 5
gcode:
    RUN_SHELL_COMMAND CMD=telegram_notify_repair
