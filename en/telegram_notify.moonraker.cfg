# Print job notifications of the telegram_notify plugin.
# Templates as in Moonraker's [notifier]: event_name, event_args.

[telegram_notify print_start]
events: started
body: The printer has started printing the file '{event_args[1].filename}'
photo: True

[telegram_notify print_complete]
events: complete
body: The printer has finished printing the file '{event_args[1].filename}'
photo: True

[telegram_notify print_error]
events: error
body: Error {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_cancelled]
events: cancelled
body: Printing canceled {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_paused]
events: paused
body: Pause {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_resumed]
events: resumed
body: Resume printing {event_args[1].message} {event_args[1].filename}
photo: True
