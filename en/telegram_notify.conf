# Settings of the telegram_notify plugin.
# After changing this file restart Moonraker or the printer.
# The plugin reads this file itself, it is not a part of the Moonraker
# config, so the bot token does not end up in moonraker.log.

[telegram_notify]
# Bot token from @BotFather, e.g. 123456789:AAE...
bot_token:
# Chat ids separated by commas, e.g. 123456789, -1001234567890, @channel
# A forum topic can be added as chat_id:topic_id
chat_id:
# Added in front of every message, e.g. the printer name
#name: AD5M
# Send the messages without a notification sound
#silent: False
# Webcam snapshot sent with the messages with a photo
#snapshot_url: http://127.0.0.1:8080/?action=snapshot
# Largest snapshot in kB (64 - 10240), a larger one is not sent
#max_photo_size: 2048
# Notifications waiting to be sent (1 - 1000), more are dropped
#max_queue: 20

# Print job messages can be changed or added here. The defaults are in
# plugins/telegram_notify/en/telegram_notify.moonraker.cfg, a section with
# the same name replaces the given options. Events: started, complete,
# error, cancelled, paused, resumed, * for all of them or none to turn the
# message off.
#[telegram_notify print_start]
#body: Started {event_args[1].filename}
#photo: False
