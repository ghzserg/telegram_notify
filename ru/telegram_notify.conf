# Настройки плагина telegram_notify.
# После изменения файла перезапустите Moonraker или принтер.
# Плагин читает этот файл сам, файл не входит в конфигурацию Moonraker,
# поэтому токен бота не попадает в moonraker.log.

[telegram_notify]
# Токен бота от @BotFather, например 123456789:AAE...
bot_token:
# Номера чатов через запятую, например 123456789, -1001234567890, @channel
# Тему форума можно указать как chat_id:topic_id
chat_id:
# Добавляется в начало каждого сообщения, например имя принтера
#name: AD5M
# Отправлять сообщения без звука
#silent: False
# Снимок с камеры для сообщений с фото
#snapshot_url: http://127.0.0.1:8080/?action=snapshot
# Наибольший размер снимка в кБ (64 - 10240), больший не отправляется
#max_photo_size: 2048
# Сколько уведомлений может ждать отправки (1 - 1000), остальные отбрасываются
#max_queue: 20

# Здесь можно изменить или добавить сообщения о печати. Сообщения по
# умолчанию находятся в plugins/telegram_notify/ru/telegram_notify.moonraker.cfg,
# секция с тем же именем заменяет указанные в ней параметры. События:
# started, complete, error, cancelled, paused, resumed, * для всех или none,
# чтобы выключить сообщение.
#[telegram_notify print_start]
#body: Начата печать {event_args[1].filename}
#photo: False
