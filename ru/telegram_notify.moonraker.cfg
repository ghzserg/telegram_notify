# Print job notifications of the telegram_notify plugin.
# Templates as in Moonraker's [notifier]: event_name, event_args.

[telegram_notify print_start]
events: started
body: Принтер начал печатать файл '{event_args[1].filename}'
photo: True

[telegram_notify print_complete]
events: complete
body: Принтер закончил печатать файл '{event_args[1].filename}'
photo: True

[telegram_notify print_error]
events: error
body: Ошибка {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_cancelled]
events: cancelled
body: Печать отменена {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_paused]
events: paused
body: Пауза {event_args[1].message} {event_args[1].filename}
photo: True

[telegram_notify print_resumed]
events: resumed
body: Продолжение печати {event_args[1].message} {event_args[1].filename}
photo: True
